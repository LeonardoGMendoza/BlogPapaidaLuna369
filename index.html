<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PapaidaLuna369 - Blog Oficial</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- Remova os @font-face muito longos e use link simples -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: Roboto, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    
    app-root {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    /* Estilo temporário enquanto o Angular carrega */
    .loading {
      text-align: center;
      padding: 50px;
      color: #6f42c1;
    }
  </style>
</head>
<body>
  <!-- Mensagem de carregamento -->
  <div class="loading" id="loading">
    <h1>🚀 Blog PapaidaLuna369</h1>
    <p>Carregando conteúdo incrível...</p>
    <p>Se esta mensagem persistir, verifique se todos os arquivos foram enviados.</p>
  </div>
  
  <app-root></app-root>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Verifica se os arquivos JS do Angular existem -->
  <script>
    // Esconde a mensagem de loading quando o Angular carregar
    setTimeout(() => {
      const loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    }, 3000);
    
    // Verifica se o blog está funcionando
    console.log('🐱‍👤 Blog PapaidaLuna369 - Verificando recursos...');
  </script>
  
  <!-- Links para os arquivos do Angular -->
  <script src="polyfills-5CFQRCPP.js" type="module"></script>
  <script src="main-56S24NVP.js" type="module"></script>
</body>
</html>
